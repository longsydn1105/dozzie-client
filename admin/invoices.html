<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quản Lý Hóa Đơn - Dozzie Admin</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            'dozzie-blue': '#219EBC',
                            'dozzie-navy': '#18233B',
                        },
                    },
                },
            };
        </script>
        <script src="../js/admin-auth-guard.js"></script>
    </head>
    <body class="bg-gray-100 font-sans antialiased">
        <div class="flex min-h-screen">
            <div id="app-sidebar" class="hidden w-64 shrink-0 md:block"></div>

            <main class="w-full flex-1 overflow-x-hidden p-10">
                <div class="mx-auto max-w-7xl">
                    <div class="mb-10 flex items-center justify-between">
                        <h1
                            class="text-dozzie-navy border-dozzie-blue inline-block border-b-4 pb-2 text-3xl font-extrabold"
                        >
                            Quản Lý Hóa Đơn
                        </h1>
                    </div>

                    <div
                        class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm"
                    >
                        <div class="overflow-x-auto">
                            <table class="w-full border-collapse text-left">
                                <thead>
                                    <tr
                                        class="bg-dozzie-navy text-sm tracking-wider text-white uppercase"
                                    >
                                        <th class="p-4 font-bold">
                                            Mã Hóa Đơn
                                        </th>
                                        <th class="p-4 font-bold">
                                            Khách Hàng
                                        </th>
                                        <th class="p-4 font-bold">Dịch Vụ</th>
                                        <th class="p-4 font-bold">Thời Gian</th>
                                        <th class="p-4 font-bold">Tổng Tiền</th>
                                        <th class="p-4 text-center font-bold">
                                            Trạng Thái
                                        </th>
                                        <th class="p-4 text-center font-bold">
                                            Hành Động
                                        </th>
                                    </tr>
                                </thead>
                                <tbody
                                    id="invoices-table-body"
                                    class="divide-y divide-gray-100 text-sm"
                                >
                                    <tr>
                                        <td
                                            colspan="7"
                                            class="p-8 text-center text-gray-500"
                                        >
                                            Đang tải dữ liệu...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script type="module">
            import { renderSidebar } from '../js/components/AdminSidebar.js';
            import '../js/adminInvoices.js';

            // Lệnh vẽ sidebar ngay lập tức khi load HTML
            renderSidebar('app-sidebar');
        </script>
    </body>
</html>

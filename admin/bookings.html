<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quản Lý Đặt Phòng - Dozzie Admin</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            'dozzie-blue': '#219EBC',
                            'dozzie-navy': '#18233B',
                            'dozzie-gray': '#F5F7FA',
                        },
                    },
                },
            };
        </script>
        <script src="../js/admin-auth-guard.js"></script>
    </head>
    <body class="bg-dozzie-gray font-sans text-gray-800 antialiased">
        <div class="flex min-h-screen">
            <div
                id="app-sidebar"
                class="z-10 hidden w-64 shrink-0 shadow-lg md:block"
            ></div>

            <main class="w-full flex-1 overflow-x-hidden p-10">
                <div class="mx-auto max-w-7xl">
                    <div
                        class="border-dozzie-blue mb-8 flex items-center justify-between border-b-4 pb-4"
                    >
                        <h1 class="text-dozzie-navy text-3xl font-extrabold">
                            Quản Lý Đặt Phòng (Bookings)
                        </h1>
                        <span
                            id="total-count"
                            class="bg-dozzie-blue rounded-lg px-4 py-2 font-bold text-white shadow-sm"
                            >Tổng: 0 đơn</span
                        >
                    </div>

                    <div
                        class="mb-8 flex flex-wrap items-end gap-4 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm"
                    >
                        <div class="min-w-[200px] flex-1">
                            <label
                                class="mb-2 block text-xs font-bold text-gray-500 uppercase"
                                >Trạng thái</label
                            >
                            <select
                                id="filter-status"
                                class="focus:ring-dozzie-blue w-full rounded-lg border border-gray-200 bg-gray-50 px-4 py-2.5 font-medium focus:ring-2 focus:outline-none"
                            >
                                <option value="">Tất cả trạng thái</option>
                                <option value="pending">
                                    ⏳ Chờ thanh toán
                                </option>
                                <option value="active">
                                    🟢 Đang hoạt động
                                </option>
                                <option value="completed">
                                    ✅ Đã hoàn thành
                                </option>
                                <option value="cancelled">❌ Đã hủy</option>
                            </select>
                        </div>

                        <div class="min-w-[150px] flex-1">
                            <label
                                class="mb-2 block text-xs font-bold text-gray-500 uppercase"
                                >Chọn Ngày</label
                            >
                            <input
                                type="date"
                                id="filter-date"
                                class="focus:ring-dozzie-blue filter-input w-full rounded-lg border border-gray-200 bg-gray-50 px-4 py-2 focus:ring-2 focus:outline-none"
                            />
                        </div>

                        <div class="min-w-[150px] flex-1">
                            <label
                                class="mb-2 block text-xs font-bold text-gray-500 uppercase"
                                >Chọn Tuần</label
                            >
                            <input
                                type="week"
                                id="filter-week"
                                class="focus:ring-dozzie-blue filter-input w-full rounded-lg border border-gray-200 bg-gray-50 px-4 py-2 focus:ring-2 focus:outline-none"
                            />
                        </div>

                        <div class="min-w-[150px] flex-1">
                            <label
                                class="mb-2 block text-xs font-bold text-gray-500 uppercase"
                                >Chọn Tháng</label
                            >
                            <input
                                type="month"
                                id="filter-month"
                                class="focus:ring-dozzie-blue filter-input w-full rounded-lg border border-gray-200 bg-gray-50 px-4 py-2 focus:ring-2 focus:outline-none"
                            />
                        </div>

                        <button
                            id="btn-clear-filter"
                            class="rounded-lg bg-gray-200 px-6 py-2.5 font-bold text-gray-700 transition-colors hover:bg-gray-300"
                        >
                            Xóa Lọc
                        </button>
                    </div>

                    <div
                        class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm"
                    >
                        <div class="overflow-x-auto">
                            <table
                                class="w-full border-collapse text-left whitespace-nowrap"
                            >
                                <thead>
                                    <tr
                                        class="bg-dozzie-navy text-sm tracking-wider text-white uppercase"
                                    >
                                        <th class="p-4 font-bold">
                                            Khách Hàng
                                        </th>
                                        <th class="p-4 font-bold">
                                            Phòng / Gói
                                        </th>
                                        <th class="p-4 font-bold">Thời Gian</th>
                                        <th class="p-4 text-right font-bold">
                                            Tổng Tiền
                                        </th>
                                        <th class="p-4 text-center font-bold">
                                            Trạng Thái
                                        </th>
                                        <th class="p-4 text-center font-bold">
                                            Hành Động
                                        </th>
                                    </tr>
                                </thead>
                                <tbody
                                    id="bookings-table-body"
                                    class="divide-y divide-gray-100 text-sm"
                                >
                                    <tr>
                                        <td
                                            colspan="6"
                                            class="p-8 text-center text-gray-500"
                                        >
                                            Đang tải dữ liệu...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script type="module">
            import { renderSidebar } from '../js/components/AdminSidebar.js';
            import '../js/admin-bookings.js';
            renderSidebar('app-sidebar');
        </script>
    </body>
</html>
